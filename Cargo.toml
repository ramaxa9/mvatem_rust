[package]
name = "mvatem_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["default_fonts", "wgpu"] }
mdns-sd = "0.9"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.7", default-features = false, features = ["decoding", "input-msmf"] }
wgpu = { version = "0.20", default-features = false, features = ["dx12"] }

[target.'cfg(not(windows))'.dependencies]
nokhwa = { version = "0.10.7", default-features = false, features = ["decoding", "input-v4l"] }
wgpu = { version = "0.20", default-features = false, features = ["vulkan-portability"] }
